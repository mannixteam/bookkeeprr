name: French catalog regression
on:
  push:
    branches: [feature/french-catalog-reliability, feature/french-catalog-release-validation]
  pull_request:
    paths:
      - 'apps/web/src/**'
      - 'apps/web/tests/**'
      - 'apps/web/scripts/french-catalog-live.ts'
      - 'apps/web/package.json'
      - 'apps/web/Dockerfile'
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - 'apps/website/public/openapi.json'
      - 'compose.fr-test.yaml'
      - 'apps/web/src/server/discover/merge.ts'
      - 'apps/web/tests/french-catalog.node.mjs'
      - '.github/workflows/french-catalog.yml'
permissions:
  contents: read
jobs:
  identifiers-and-editions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test apps/web/tests/french-catalog.node.mjs
  web-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: '9.15.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends p7zip-full
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bookkeeprr/web typecheck
      - name: Live French catalog smoke
        continue-on-error: true
        working-directory: apps/web
        run: pnpm exec tsx scripts/french-catalog-live.ts | tee french-catalog-live.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: french-catalog-live
          path: apps/web/french-catalog-live.json
      - run: pnpm --filter @bookkeeprr/web test
        env:
          BOOKKEEPRR_7Z_BIN: 7z
      - run: pnpm --filter @bookkeeprr/web build
  container:
    needs: web-validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Validate isolated Compose file
        run: docker compose -f compose.fr-test.yaml config --quiet
      - name: Build isolated test image
        run: docker build -f apps/web/Dockerfile --build-arg BOOKKEEPRR_COMMIT=${{ github.sha }} -t bookkeeprr-fr:test .
      - name: Boot fresh configuration
        run: |
          docker run -d --name bookkeeprr-fr-smoke -p 127.0.0.1:3303:3000 bookkeeprr-fr:test
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3303/api/health; then exit 0; fi
            sleep 2
          done
          docker logs bookkeeprr-fr-smoke
          exit 1
      - name: Verify image decoder in production container
        run: |
          docker exec -i bookkeeprr-fr-smoke node <<'JS'
          const assert = require('node:assert/strict');
          const sharp = require('sharp');
          (async () => {
            const png = await sharp({ create: { width: 120, height: 180, channels: 3, background: '#ac8040' } }).png().toBuffer();
            const webp = await sharp(png, { limitInputPixels: 20000000, failOn: 'warning' }).webp().toBuffer();
            assert.equal((await sharp(webp).metadata()).format, 'webp');
            console.log('Production image decoder OK');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Container logs
        if: always()
        run: docker logs bookkeeprr-fr-smoke || true
