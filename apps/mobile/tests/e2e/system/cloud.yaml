# System group — Cloud connection flow.
# NOT in the CI flow lists (.gitlab/ci/mobile-*.yml): the Cloud settings row is
# hidden behind CLOUD_FEATURES_ENABLED=false (src/lib/features.ts) until the
# cloud service ships, so scrollUntilVisible row-cloud can never succeed.
# Re-add the flow to both CI lists when the flag flips on.
# Modeled on tests/e2e/system/audit-log.yaml. Cloud is admin-gated, so it
# relies on the AUTOAUTH admin session from the connected onboarding flow.
appId: com.bookkeeprr.app
env:
  EXPO_PUBLIC_MOBILE_E2E: '1'
  EXPO_PUBLIC_MOBILE_E2E_AUTOAUTH: '1'
---
# connected.yaml does its own launchApp clearState — double-launching crashes
# Android and flakes iOS (see library-list.yaml / calendar.yaml).
- runFlow: { file: ../onboarding/connected.yaml }
- tapOn: { id: 'btn-go-library' }
- tapOn: { text: 'Settings' }
- scrollUntilVisible:
    element: { id: 'row-cloud' }
    centerElement: true
- tapOn: { id: 'row-cloud' }
- assertVisible: { id: 'screen-cloud' }
- assertVisible: { id: 'cloud-status' }
